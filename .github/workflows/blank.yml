name: Deploy PBIP to Power BI

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate with Azure AD
        run: |
          curl -X POST \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "client_id=${{ secrets.PBI_CLIENT_ID }}" \
          -d "scope=https://analysis.windows.net/powerbi/api/.default" \
          -d "client_secret=${{ secrets.PBI_CLIENT_SECRET }}" \
          -d "grant_type=client_credentials" \
          https://login.microsoftonline.com/${{ secrets.PBI_TENANT_ID }}/oauth2/v2.0/token \
          -o token.json

      - name: Publish PBIP to Power BI
        run: |
          ACCESS_TOKEN=$(jq -r '.access_token' token.json)
          curl -X POST \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Content-Type: multipart/form-data" \
          -F "file=@custm.pbip" \
          "https://api.powerbi.com/v1.0/myorg/groups/${{ secrets.PBI_WORKSPACE_ID }}/imports?datasetDisplayName=Pbip-project-1"
